<header class="bl-custom-header">
  <div class="bl-header-inner">
    <a href="/" class="bl-logo-link">
      <img id="blLogoImg" src="https://files.easy-orders.net/1791473000481535121.png" alt="Storify" class="bl-logo">
      <span class="bl-brand-text">Storify <span class="bl-brand-thin">Theme Store</span></span>
    </a>

    <nav class="bl-nav-desktop">
      <button class="bl-menu-btn" id="blMenuBtn" onclick="blToggleDesktopMenu(event)">MENU <span class="chev">▼</span></button>

      <div class="bl-desktop-dropdown" id="blDesktopDropdown">
        <a href="/" class="bl-dropdown-link">Home</a>
        <a href="/collections/Portfolio" class="bl-dropdown-link">Portfolio</a>
        <a href="/collections/Themes" class="bl-dropdown-link bl-active">Themes</a>
        <a href="/collections/Applications-Designe" class="bl-dropdown-link">Applications Design</a>
        <a href="/collections/Services" class="bl-dropdown-link">Services</a>
      </div>

      <!-- زر البحث -->
      <button class="bl-icon-btn" aria-label="Search" onclick="blToggleSearch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- زر الدارك مود (Desktop) -->
      <button class="bl-icon-btn bl-theme-toggle" aria-label="Toggle Dark Mode" onclick="blToggleDarkMode()">
        <svg class="bl-theme-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <a href="https://app.easy-orders.net/login#/login" target="_blank" rel="noopener noreferrer" class="bl-link">Log in</a>
      <a href="https://www.easy-orders.net?view=caf2e190-f8ea-4160-9ed5-a5fd97f372bd" target="_blank" rel="noopener noreferrer" class="bl-cta">Start for free</a>
    </nav>

    <div class="bl-mobile-actions">
      <button class="bl-icon-btn" aria-label="Search" onclick="blToggleSearch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- زر الدارك مود (Mobile) -->
      <button class="bl-icon-btn bl-theme-toggle" aria-label="Toggle Dark Mode" onclick="blToggleDarkMode()">
        <svg class="bl-theme-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="bl-hamburger" onclick="blOpenMenu()">☰</button>
    </div>
  </div>

  <div class="bl-search-panel" id="blSearchPanel">
    <div class="bl-search-panel-inner">
      <input
        type="text"
        id="bl-header-search"
        class="bl-search-input"
        placeholder="Search themes..."
        oninput="blHandleSearch(this)"
      />
      <button class="bl-search-close" onclick="blCloseSearch()">✕</button>
    </div>
  </div>
</header>

<div id="blHeaderSpacer"></div>

<div class="bl-menu-overlay" id="blMenuOverlay">
  <button class="bl-menu-close" onclick="blCloseMenu()">✕</button>

  <ul class="bl-menu-links">
    <li><a href="/" class="bl-menu-link">Home</a></li>
    <li><a href="/collections/Portfolio" class="bl-menu-link">Portfolio</a></li>
    <li><a href="/collections/Themes" class="bl-menu-link bl-active">Themes</a></li>
    <li><a href="/collections/Applications-Designe" class="bl-menu-link">Applications Design</a></li>
    <li><a href="/collections/Services" class="bl-menu-link">Services</a></li>
  </ul>

  <div class="bl-menu-divider"></div>

  <a href="https://www.easy-orders.net?view=caf2e190-f8ea-4160-9ed5-a5fd97f372bd" target="_blank" rel="noopener noreferrer" class="bl-menu-cta">Start for free</a>
  <a href="https://app.easy-orders.net/login#/login" target="_blank" rel="noopener noreferrer" class="bl-menu-login">Log in</a>
</div>

<section class="themes-page">
  <div class="collection-title">
    <h1>Browse all themes</h1>

    <button
      type="button"
      class="filter-btn-mobile collection-title-filter"
      onclick="openPopup()"
    >
      Filter
    </button>
  </div>

  <div class="collection-layout">
    <aside class="sidebar" aria-label="Theme filters">
      <div id="sidebar-filters"></div>
    </aside>

    <main class="main">
      <div class="collection-toolbar">
        <span id="count-label">0 Demos</span>

        <div class="toolbar-actions">
          <div class="sort-control">
            <label for="theme-sort">Sort</label>

            <select
              id="theme-sort"
              aria-label="Sort Demos"
              onchange="handleSort(this.value)"
            >
              <option value="az">A to Z</option>
              <option value="bestseller">Best Seller</option>
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
            </select>

            <span class="sort-arrow" aria-hidden="true"></span>
          </div>
        </div>
      </div>

      <div id="active-filters" class="active-filters"></div>

      <div class="grid" id="grid"></div>
      <div class="pagination" id="pagination"></div>
    </main>
  </div>
</section>

<div
  class="popup-overlay"
  id="popup"
  onclick="handleOverlayClick(event)"
>
  <div class="popup-box">
    <div class="popup-header">
      <h2>Filter</h2>

      <button
        type="button"
        class="popup-done"
        onclick="closePopup()"
      >
        Done
      </button>
    </div>

    <div
      class="mobile-theme-sort-section"
      id="mobile-theme-sort-section"
    >
      <div class="mobile-theme-sort-title">
        <span>Sort by</span>
      </div>

      <div
        class="mobile-theme-options"
        id="mobile-theme-options"
      ></div>
    </div>

    <div id="popup-filters"></div>
  </div>
</div>

<div class="blf-full-bleed">

  <footer class="bl-shopify-footer">

    <!-- ===== الجزء العلوي ===== -->
    <div class="blf-hero">

      <h2 class="blf-hero-title">
        Build fast and grow more<br>
        with Storify Themes
      </h2>

      <a
        href="https://www.easy-orders.net?view=caf2e190-f8ea-4160-9ed5-a5fd97f372bd"
        target="_blank"
        rel="noopener noreferrer"
        class="blf-main-cta"
      >
        Start your free trial
      </a>

    </div>

  </footer>

</div>
